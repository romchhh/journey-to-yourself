# Nginx конфігурація для захисту від майнерів
# Додайте ці правила до вашого nginx.conf або site config

# Блокуємо виконання підозрілих файлів
location ~* \.(sh|php|py|exe|bat|cmd|ps1|jar|war)$ {
    deny all;
    return 403;
}

# Блокуємо файли з випадковими назвами (20+ символів)
location ~* /[a-z0-9]{20,}\.(html|js|php|sh|py|exe|bat|cmd|ps1|jar|war)$ {
    deny all;
    return 403;
}

# Блокуємо доступ до прихованих файлів
location ~ /\. {
    deny all;
    return 403;
}

# Блокуємо backup файли
location ~* \.(bak|backup|old|tmp|temp)$ {
    deny all;
    return 403;
}

# Захист від path traversal
location ~ /\.\. {
    deny all;
    return 403;
}

# Security Headers
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net https://www.facebook.com https://secure.wayforpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://connect.facebook.net https://graph.facebook.com https://secure.wayforpay.com; frame-src 'self' https://www.instagram.com https://secure.wayforpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'none'; child-src 'none'; manifest-src 'self'; media-src 'self';" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header X-Download-Options "noopen" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Блокуємо підозрілі User-Agent (але дозволяємо легальні боти)
if ($http_user_agent ~* (miner|coin|crypto|stratum|pool|scraper)) {
    set $block_ua 1;
}
if ($http_user_agent ~* (googlebot|bingbot|facebookexternalhit|slurp|duckduckbot)) {
    set $block_ua 0;
}
if ($block_ua = 1) {
    return 403;
}

# Блокуємо підозрілі query параметри
if ($args ~* (<script|javascript:|onerror=|onload=|eval\(|\.\.%2f|\.\.%5c)) {
    return 400;
}

# Блокуємо занадто довгі URL
if ($request_uri ~ .{2049,}) {
    return 414;
}

# Обмежуємо розмір тіла запиту (захист від завантаження великих файлів)
client_max_body_size 1M;

# Блокуємо завантаження файлів через POST до public
location ~ ^/public/ {
    limit_except GET {
        deny all;
    }
}

